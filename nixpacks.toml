# Railway uses Nixpacks for builds
# We need both Python (runtime) and Node.js (UI build)

[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
    "pip install -r requirements-prod.txt",
    "cd ui && npm ci"
]

[phases.build]
cmds = ["cd ui && npm run build"]

[start]
cmd = "python -m uvicorn server.main:app --host 0.0.0.0 --port ${PORT:-8888}"
