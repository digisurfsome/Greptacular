name: Notify on CI Failure

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  notify-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Get failed branch info
        id: branch
        run: |
          echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"

      - name: Download failure logs
        uses: actions/github-script@v7
        id: logs
        with:
          script: |
            const runId = ${{ github.event.workflow_run.id }};

            // Get the failed jobs
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              filter: 'latest'
            });

            let failureSummary = [];
            for (const job of jobs.data.jobs) {
              if (job.conclusion === 'failure') {
                const failedSteps = job.steps
                  .filter(s => s.conclusion === 'failure')
                  .map(s => s.name);
                failureSummary.push(`**${job.name}**: ${failedSteps.join(', ')}`);
              }
            }

            const summary = failureSummary.length > 0
              ? failureSummary.join('\n')
              : 'Could not determine which steps failed.';

            core.setOutput('summary', summary);

      - name: Find open PR for this branch
        uses: actions/github-script@v7
        id: find-pr
        with:
          script: |
            const branch = '${{ steps.branch.outputs.branch }}';
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });

            if (prs.data.length > 0) {
              core.setOutput('pr_number', prs.data[0].number);
              core.setOutput('found', 'true');
            } else {
              core.setOutput('found', 'false');
            }

      - name: Comment on PR with failure details
        if: steps.find-pr.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.find-pr.outputs.pr_number }};
            const branch = '${{ steps.branch.outputs.branch }}';
            const runId = ${{ steps.branch.outputs.run_id }};
            const sha = '${{ steps.branch.outputs.sha }}';
            const summary = `${{ steps.logs.outputs.summary }}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const body = `## CI Failed — Please Fix

            The tests failed on commit \`${sha.substring(0, 7)}\` (branch \`${branch}\`).

            **What failed:**
            ${summary}

            **Full logs:** [View CI run](${runUrl})

            Please fix the failing checks and push again to this branch.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

      - name: Open issue if no PR exists
        if: steps.find-pr.outputs.found == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ steps.branch.outputs.branch }}';
            const runId = ${{ steps.branch.outputs.run_id }};
            const sha = '${{ steps.branch.outputs.sha }}';
            const summary = `${{ steps.logs.outputs.summary }}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI Failed on branch ${branch}`,
              body: `## CI Failed — Needs Fix

              Branch \`${branch}\` (commit \`${sha.substring(0, 7)}\`) failed CI checks.

              **What failed:**
              ${summary}

              **Full logs:** [View CI run](${runUrl})

              Please fix the failing checks and push again.`,
              labels: ['ci-failure']
            });
