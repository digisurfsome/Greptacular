name: ce-pre-build--fully-autonomous
description: |
  Use when: You have a PRD, app idea, or concept and want a full analysis plan before building.
  Triggers: "analyze my PRD", "plan my app autonomously", "auto-analyze PRD"
  NOT for: Existing codebases or adding features to existing apps.
  Mode: Fully autonomous — scans PRD, writes plan, runs analysis. No stops.
provider: claude
interactive: false

nodes:
  - id: context-intake
    command: ce-intake-pre-build
    context: fresh

  - id: plan
    command: ce-plan
    depends_on: [context-intake]
    context: fresh
    model: claude-opus-4-6

  - id: security-review
    command: ce-security-review
    depends_on: [plan]
    context: fresh

  - id: correctness-review
    command: ce-correctness-review
    depends_on: [plan]
    context: fresh

  - id: performance-review
    command: ce-performance-review
    depends_on: [plan]
    context: fresh

  - id: synthesize-review
    command: ce-synthesize-review
    depends_on: [security-review, correctness-review, performance-review]
    trigger_rule: one_success
    context: fresh
    model: claude-opus-4-6

  - id: compound
    command: ce-compound
    depends_on: [synthesize-review]
    context: fresh
