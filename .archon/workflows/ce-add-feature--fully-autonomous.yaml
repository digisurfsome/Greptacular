name: ce-add-feature--fully-autonomous
description: |
  Use when: You have an existing codebase and want to add a specific new feature to it.
  Triggers: "add feature", "new feature", "extend my app", "build this into my codebase"
  NOT for: New projects from scratch or general code improvement without a specific feature.
  Mode: Fully autonomous — scans codebase, writes plan, runs analysis. No stops.
provider: claude
interactive: false

nodes:
  - id: context-intake
    command: ce-intake-add-feature
    context: fresh

  - id: plan
    command: ce-plan
    depends_on: [context-intake]
    context: fresh
    model: claude-opus-4-6

  - id: security-review
    command: ce-security-review
    depends_on: [plan]
    context: fresh

  - id: correctness-review
    command: ce-correctness-review
    depends_on: [plan]
    context: fresh

  - id: performance-review
    command: ce-performance-review
    depends_on: [plan]
    context: fresh

  - id: synthesize-review
    command: ce-synthesize-review
    depends_on: [security-review, correctness-review, performance-review]
    trigger_rule: one_success
    context: fresh
    model: claude-opus-4-6

  - id: compound
    command: ce-compound
    depends_on: [synthesize-review]
    context: fresh
