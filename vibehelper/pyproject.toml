[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "vibehelper"
version = "0.1.0"
description = "Your AI coding sidekick — press a hotkey, it reads your screen and fixes everything"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["ai", "coding", "assistant", "screen-reader", "vibe-coding", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "anthropic>=0.40.0",
    "Pillow>=10.0.0",
    "pynput>=1.7.0",
]

[project.scripts]
vibehelper = "vibehelper.cli:main"

[project.urls]
Homepage = "https://github.com/digisurfsome/Greptacular"
Issues = "https://github.com/digisurfsome/Greptacular/issues"

[tool.setuptools.packages.find]
include = ["vibehelper*"]

[tool.setuptools.package-data]
vibehelper = ["brain_default.md"]
