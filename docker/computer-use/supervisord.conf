; Supervisord configuration for Computer Use container
; Manages Xvfb, x11vnc, websockify/noVNC, and Chromium

[supervisord]
nodaemon=true
user=agent
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/supervisor

; Virtual display (Xvfb)
[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_DISPLAY_WIDTH)sx%(ENV_DISPLAY_HEIGHT)sx%(ENV_DISPLAY_DEPTH)s -ac +extension GLX +render -noreset
autorestart=true
priority=100
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb_err.log

; VNC server (x11vnc)
[program:x11vnc]
command=/usr/bin/x11vnc -display :0 -nopw -listen 0.0.0.0 -rfbport 5900 -shared -forever -noxdamage
autorestart=true
priority=200
startsecs=3
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc_err.log

; noVNC via websockify (WebSocket proxy to VNC)
[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
priority=300
startsecs=5
stdout_logfile=/var/log/supervisor/websockify.log
stderr_logfile=/var/log/supervisor/websockify_err.log
