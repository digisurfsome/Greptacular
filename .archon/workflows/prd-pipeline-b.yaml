name: prd-pipeline-b
description: |
  Use when: User wants the FULL factory — PRD planning through to built, reviewed, tested code.
  Triggers: "prd pipeline b", "full build", "plan and build", "factory build", "end to end build".
  Does: Complete pipeline combining your 11-stage PRD system with Cole's proven execution:
        1. YOUR PRD stages (0-5, 7-10) with enhanced gap analysis and feasibility
        2. COLE's Plan cookbook (codebase intelligence, code snippets, patterns to mirror)
        3. COLE's Implement cookbook (execute with validation gates)
        4. YOUR Verification (Wall/Door/Room compliance, Pulse/Seam/Full)
        5. COLE's Review (4 parallel agents attacking the code)
        6. Fix cycle with two-strike rule
        7. Report
  NOT for: Quick fixes, PR reviews, single-file changes.

provider: claude
model: opus

nodes:
  # ═══════════════════════════════════════════════════════════════
  # STAGE 0: TECHNICAL FOUNDATION
  # Locks down the tech stack before anything else
  # ═══════════════════════════════════════════════════════════════

  - id: stage-00-tech-foundation
    command: prd-stage-00

  # ═══════════════════════════════════════════════════════════════
  # STAGE 1: IDEA CAPTURE
  # Preserves the raw app idea exactly as stated
  # ═══════════════════════════════════════════════════════════════

  - id: stage-01-idea-capture
    command: prd-stage-01
    depends_on: [stage-00-tech-foundation]

  # ═══════════════════════════════════════════════════════════════
  # STAGE 2: GAP ANALYSIS + MARKET RESEARCH
  # Finds missing puzzle pieces, researches the market
  # ═══════════════════════════════════════════════════════════════

  - id: stage-02-gap-analysis
    command: prd-a-stage-02-enhanced
    depends_on: [stage-01-idea-capture]

  # ═══════════════════════════════════════════════════════════════
  # STAGE 3: AGENT OS STRUCTURING
  # Five Lenses framework — drift anchor, personas, feasibility
  # ═══════════════════════════════════════════════════════════════

  - id: stage-03-agent-os
    command: prd-a-stage-03-enhanced
    depends_on: [stage-02-gap-analysis]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # STAGE 4: MECHANISM EXTRACTION
  # Decomposes concept into every discrete user action
  # ═══════════════════════════════════════════════════════════════

  - id: stage-04-mechanism-extraction
    command: prd-stage-04
    depends_on: [stage-03-agent-os]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # STAGE 5: WALL/DOOR/ROOM SCAFFOLDING
  # Classifies each mechanism — what can change vs. what is fixed
  # ═══════════════════════════════════════════════════════════════

  - id: stage-05-wall-door-room
    command: prd-stage-05
    depends_on: [stage-04-mechanism-extraction]
    context: fresh
    idle_timeout: 600000

  # ═══════════════════════════════════════════════════════════════
  # STAGE 7: PHASE SEQUENCING
  # Splits spec into ordered buildable phases
  # ═══════════════════════════════════════════════════════════════

  - id: stage-07-phase-sequencing
    command: prd-stage-07
    depends_on: [stage-05-wall-door-room]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # STAGE 8: PROTOCOL INJECTION
  # Injects verification checkpoints into each phase
  # ═══════════════════════════════════════════════════════════════

  - id: stage-08-protocol-injection
    command: prd-stage-08
    depends_on: [stage-07-phase-sequencing]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # STAGE 9: VERIFICATION AGENT SETUP
  # Configures the independent audit agent
  # ═══════════════════════════════════════════════════════════════

  - id: stage-09-verification-setup
    command: prd-stage-09
    depends_on: [stage-08-protocol-injection]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # STAGE 10: OUTPUT GENERATOR
  # Renders the final copy-paste-ready build package
  # ═══════════════════════════════════════════════════════════════

  - id: stage-10-output-generator
    command: prd-stage-10
    depends_on: [stage-09-verification-setup]
    context: fresh
    idle_timeout: 600000

  # ═══════════════════════════════════════════════════════════════
  # BUILD: CODEBASE INTELLIGENCE
  # Enriches PRD with real implementation patterns from codebase
  # ═══════════════════════════════════════════════════════════════

  - id: build-codebase-intelligence
    command: build-codebase-plan
    depends_on: [stage-10-output-generator]
    context: fresh
    idle_timeout: 600000

  # ═══════════════════════════════════════════════════════════════
  # BUILD: EXECUTE
  # Builds the code step by step with validation gates
  # ═══════════════════════════════════════════════════════════════

  - id: build-execute
    command: build-implement
    depends_on: [build-codebase-intelligence]
    model: sonnet
    context: fresh
    idle_timeout: 900000

  # ═══════════════════════════════════════════════════════════════
  # BUILD: VERIFY COMPLIANCE
  # Wall/Door/Room compliance + Pulse/Seam/Full checks
  # ═══════════════════════════════════════════════════════════════

  - id: build-verify-compliance
    command: build-verify
    depends_on: [build-execute]
    model: sonnet
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # BUILD: REVIEW — 4 parallel agents attacking the code
  # ═══════════════════════════════════════════════════════════════

  - id: review-correctness-logic
    command: build-review-correctness
    depends_on: [build-verify-compliance]
    model: sonnet
    context: fresh

  - id: review-silent-failures
    command: build-review-failures
    depends_on: [build-verify-compliance]
    model: sonnet
    context: fresh

  - id: review-test-coverage
    command: build-review-tests
    depends_on: [build-verify-compliance]
    model: sonnet
    context: fresh

  - id: review-simplify-code
    command: build-review-simplify
    depends_on: [build-verify-compliance]
    model: sonnet
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # BUILD: FIX
  # Synthesizes all 4 reviews and fixes issues
  # ═══════════════════════════════════════════════════════════════

  - id: build-fix-issues
    command: build-fix
    depends_on: [review-correctness-logic, review-silent-failures, review-test-coverage, review-simplify-code]
    model: sonnet
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # BUILD: REPORT
  # Full pipeline summary
  # ═══════════════════════════════════════════════════════════════

  - id: build-final-report
    command: build-report
    depends_on: [build-fix-issues]
    model: haiku
    context: fresh
    trigger_rule: all_done

  # ═══════════════════════════════════════════════════════════════
  # BUILD: DEPLOY
  # Packages and pushes to target repository
  # ═══════════════════════════════════════════════════════════════

  - id: build-deploy
    command: build-deploy
    depends_on: [build-final-report]
    model: sonnet
    context: fresh
