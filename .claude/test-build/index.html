<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; background: #1a1a2e; color: #eee; }
  h1 { font-size: 1.5rem; margin-bottom: 16px; }
  .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
  input { flex: 1; padding: 8px 12px; border: 1px solid #444466; border-radius: 4px; font-size: 1rem; background: #16213e; color: #eee; outline: none; }
  input:focus { border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79,70,229,0.3); }
  input::placeholder { color: #6b7280; }
  button { padding: 8px 14px; background: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; transition: background 0.15s, transform 0.1s; }
  button:hover { background: #6366f1; transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid #2d2d4e; border-radius: 4px; margin-bottom: 8px; background: #16213e; }
  .del { background: #ef4444; padding: 4px 10px; font-size: 0.85rem; }
  .del:hover { background: #f87171; }
  .empty { color: #6b7280; font-size: 0.9rem; }
</style>
</head>
<body>
<h1>Todos</h1>
<div class="input-row">
  <input id="input" type="text" placeholder="Add a todo..." />
  <button onclick="addTodo()">Add</button>
</div>
<ul id="list"></ul>

<script>
  let todos = JSON.parse(localStorage.getItem('todos') || '[]');

  function render() {
    const list = document.getElementById('list');
    list.innerHTML = todos.length === 0
      ? '<p class="empty">No todos yet.</p>'
      : todos.map((t, i) => `<li><span>${t}</span><button class="del" onclick="deleteTodo(${i})">Delete</button></li>`).join('');
  }

  function addTodo() {
    const input = document.getElementById('input');
    const val = input.value.trim();
    if (!val) return;
    todos.push(val);
    localStorage.setItem('todos', JSON.stringify(todos));
    input.value = '';
    render();
  }

  function deleteTodo(i) {
    todos.splice(i, 1);
    localStorage.setItem('todos', JSON.stringify(todos));
    render();
  }

  document.getElementById('input').addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });
  render();
</script>
</body>
</html>
