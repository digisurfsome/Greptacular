name: prd-pipeline-BUILD
description: |
  Use when: User has a COMPLETED PRD bundle and wants to skip planning and go straight to build.
  Triggers: "build from prd", "build only", "prd pipeline build".
  Does: Skips stages 0-10. Takes a PRD bundle as input. Runs build phases only:
        1. Validate PRD bundle (required files present)
        2. Codebase intelligence (read what exists, plan patterns)
        3. Phase 1: execute → review x4 → fix → compliance → [recovery] → checkpoint
        4. Phase 2: same pattern (conditional on bundle phase count)
        5. Phase 3: same pattern (conditional)
        6. Claude.md audit, Cartographer, Deploy gate, Report, Deploy, Archive
  Input: Set env var PRD_BUNDLE_DIR to absolute path of PRD bundle directory.
         Bundle must contain: context_packet.json, CLAUDE.md, BUILD_RULES.md,
         README.md, build.sh, .env.example, phases/phase-1.md (+ optional 2,3).
  NOT for: Building without a PRD. Use prd-pipeline-c for full planning + build.

provider: claude
model: opus

nodes:

  # ═══════════════════════════════════════════════════════════════
  # FEATURE FLAG READERS (M12)
  # ═══════════════════════════════════════════════════════════════

  - id: read-flag-recovery
    bash: |
      if [ -f .archon/features.yaml ] && grep -q '^recovery_pipeline:[[:space:]]*false' .archon/features.yaml 2>/dev/null; then
        echo false
      else
        echo true
      fi
    timeout: 30000

  - id: read-flag-archive
    bash: |
      if [ -f .archon/features.yaml ] && grep -q '^prd_archive:[[:space:]]*false' .archon/features.yaml 2>/dev/null; then
        echo false
      else
        echo true
      fi
    timeout: 30000

  - id: read-flag-cartographer
    bash: |
      if [ -f .archon/features.yaml ] && grep -q '^codebase_cartographer:[[:space:]]*false' .archon/features.yaml 2>/dev/null; then
        echo false
      else
        echo true
      fi
    timeout: 30000

  # ═══════════════════════════════════════════════════════════════
  # INPUT VALIDATION — NEW ENTRY POINT
  # Verifies PRD_BUNDLE_DIR is set and contains required files.
  # Copies bundle contents into the run's artifacts directory so
  # downstream stages can read them like a freshly-generated PRD.
  # ═══════════════════════════════════════════════════════════════

  - id: validate-and-import-bundle
    bash: |
      set -euo pipefail
      # Bundle path — git-bash POSIX format. Edit to change source bundle.
      PRD_BUNDLE_DIR="/c/Users/lober/.archon/workspaces/digisurfsome/audio-recorder-scaled/artifacts/runs/0087c45cd7da9fc15fad9193f3277946"
      # Convert Archon's Windows-style ARTIFACTS_DIR (with backslashes) to POSIX
      ART_DIR=$(echo "$ARTIFACTS_DIR" | sed 's|\\|/|g' | sed 's|^\([A-Za-z]\):|/\L\1|')
      echo "Source bundle: $PRD_BUNDLE_DIR"
      echo "Target artifacts: $ART_DIR"
      if [ ! -d "$PRD_BUNDLE_DIR" ]; then
        echo "FAIL: source bundle not found at $PRD_BUNDLE_DIR" >&2
        exit 1
      fi
      mkdir -p "$ART_DIR"
      cp -r "$PRD_BUNDLE_DIR"/. "$ART_DIR/"
      phase_count=$(ls "$ART_DIR/phases"/phase-*.md 2>/dev/null | wc -l | tr -d ' ')
      echo "PASS: imported bundle. phase_count=$phase_count"
    timeout: 120000
    depends_on: [read-flag-recovery, read-flag-archive, read-flag-cartographer]

  # ═══════════════════════════════════════════════════════════════
  # BUILD: CODEBASE INTELLIGENCE
  # ═══════════════════════════════════════════════════════════════

  - id: build-codebase-intelligence
    command: build-codebase-plan
    depends_on: [validate-and-import-bundle]
    context: fresh
    idle_timeout: 600000

  # ═══════════════════════════════════════════════════════════════
  # Capture baseline SHA before any code is written.
  # ═══════════════════════════════════════════════════════════════

  - id: phase-1-baseline
    bash: |
      git rev-parse HEAD 2>/dev/null || echo "HEAD-fallback-phase1"
    depends_on: [build-codebase-intelligence]

  # ═══════════════════════════════════════════════════════════════
  # BUILD: EXECUTE
  # ═══════════════════════════════════════════════════════════════

  - id: build-execute
    command: build-implement
    depends_on: [phase-1-baseline]
    model: sonnet
    context: fresh
    idle_timeout: 900000

  # ═══════════════════════════════════════════════════════════════
  # BUILD: VERIFY COMPLIANCE
  # ═══════════════════════════════════════════════════════════════

  - id: build-verify-compliance
    command: build-verify
    depends_on: [build-execute]
    model: sonnet
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # BUILD: REVIEW — 4 parallel agents
  # ═══════════════════════════════════════════════════════════════

  - id: review-correctness-logic
    command: build-review-correctness
    depends_on: [build-verify-compliance]
    model: sonnet
    context: fresh
    retry:
      max_attempts: 3
      on_error: all

  - id: review-silent-failures
    command: build-review-failures
    depends_on: [build-verify-compliance]
    model: sonnet
    context: fresh
    retry:
      max_attempts: 3
      on_error: all

  - id: review-test-coverage
    command: build-review-tests
    depends_on: [build-verify-compliance]
    model: sonnet
    context: fresh
    retry:
      max_attempts: 3
      on_error: all

  - id: review-simplify-code
    command: build-review-simplify
    depends_on: [build-verify-compliance]
    model: sonnet
    context: fresh
    retry:
      max_attempts: 3
      on_error: all

  # ═══════════════════════════════════════════════════════════════
  # BUILD: FIX — Opus
  # ═══════════════════════════════════════════════════════════════

  - id: phase-1-lint-autofix
    bash: python3 .archon/scripts/lint-autofix.py "$ARTIFACTS_DIR"
    timeout: 120000
    depends_on: [build-execute]

  - id: build-fix-issues
    command: build-fix-v2
    depends_on: [review-correctness-logic, review-silent-failures, review-test-coverage, review-simplify-code, phase-1-lint-autofix]
    trigger_rule: none_failed_min_one_success
    model: opus
    effort: medium
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # COMPLIANCE GATE (M1)
  # ═══════════════════════════════════════════════════════════════

  - id: compliance-gate
    bash: |
      set +e
      python3 .archon/scripts/compliance-gate.py "$ARTIFACTS_DIR"
      code=$?
      if [ $code -eq 0 ]; then echo "PASS"; else echo "FAIL"; fi
      exit 0
    timeout: 60000
    depends_on: [build-fix-issues]

  # ═══════════════════════════════════════════════════════════════
  # RECOVERY PIPELINE (M9)
  # ═══════════════════════════════════════════════════════════════

  - id: recovery-diagnose
    command: recovery-diagnose
    depends_on: [compliance-gate, read-flag-recovery]
    when: "$compliance-gate.output == 'FAIL' && $read-flag-recovery.output == 'true'"
    model: opus
    effort: high
    context: fresh

  - id: recovery-fix-prd
    command: recovery-fix-prd
    depends_on: [recovery-diagnose]
    when: "$compliance-gate.output == 'FAIL' && $read-flag-recovery.output == 'true'"
    model: opus
    effort: high
    context: fresh

  - id: recovery-execute
    command: recovery-execute
    depends_on: [recovery-fix-prd]
    when: "$compliance-gate.output == 'FAIL' && $read-flag-recovery.output == 'true'"
    model: opus
    effort: high
    context: fresh

  - id: compliance-regate
    bash: |
      set +e
      python3 .archon/scripts/compliance-gate.py "$ARTIFACTS_DIR"
      code=$?
      if [ $code -eq 0 ]; then echo "PASS"; else echo "FAIL"; fi
      exit 0
    timeout: 60000
    depends_on: [recovery-execute]
    when: "$compliance-gate.output == 'FAIL' && $read-flag-recovery.output == 'true'"

  - id: compliance-final-status
    bash: |
      set -euo pipefail
      if [ $compliance-gate.output = PASS ]; then
        echo "PASS"
      elif [ $compliance-regate.output = PASS ]; then
        echo "PASS"
      else
        echo "FAIL: compliance gate failed and recovery did not pass" >&2
        exit 1
      fi
    depends_on: [compliance-gate, compliance-regate]
    trigger_rule: all_done

  # ═══════════════════════════════════════════════════════════════
  # FULL CHECKPOINT — PHASE 1 (M2)
  # ═══════════════════════════════════════════════════════════════

  - id: full-checkpoint
    bash: |
      python3 .archon/scripts/full-checkpoint.py "$ARTIFACTS_DIR" $phase-1-baseline.output
    timeout: 300000
    depends_on: [compliance-final-status]

  # ═══════════════════════════════════════════════════════════════
  # ========= PHASE 2 =========
  # ═══════════════════════════════════════════════════════════════

  - id: phase-1-handoff
    command: phase-handoff
    depends_on: [full-checkpoint]
    model: haiku
    context: fresh

  - id: phase-2-baseline
    bash: |
      git rev-parse HEAD 2>/dev/null || echo "HEAD-fallback-phase2"
    depends_on: [phase-1-handoff]

  - id: phase-2-execute
    command: build-execute-v2
    depends_on: [phase-2-baseline]
    model: sonnet
    context: fresh
    idle_timeout: 900000

  - id: phase-2-review-correctness
    command: build-review-correctness
    depends_on: [phase-2-execute]
    model: sonnet
    context: fresh
    retry:
      max_attempts: 3
      on_error: all

  - id: phase-2-review-failures
    command: build-review-failures
    depends_on: [phase-2-execute]
    model: sonnet
    context: fresh
    retry:
      max_attempts: 3
      on_error: all

  - id: phase-2-review-tests
    command: build-review-tests
    depends_on: [phase-2-execute]
    model: sonnet
    context: fresh
    retry:
      max_attempts: 3
      on_error: all

  - id: phase-2-review-simplify
    command: build-review-simplify
    depends_on: [phase-2-execute]
    model: sonnet
    context: fresh
    retry:
      max_attempts: 3
      on_error: all

  - id: phase-2-lint-autofix
    bash: python3 .archon/scripts/lint-autofix.py "$ARTIFACTS_DIR"
    timeout: 120000
    depends_on: [phase-2-execute]

  - id: phase-2-fix
    command: build-fix-v2
    depends_on: [phase-2-review-correctness, phase-2-review-failures, phase-2-review-tests, phase-2-review-simplify, phase-2-lint-autofix]
    trigger_rule: none_failed_min_one_success
    model: opus
    effort: medium
    context: fresh

  - id: phase-2-test-writer
    command: test-writer
    depends_on: [phase-2-execute]
    model: sonnet
    context: fresh

  - id: phase-2-compliance
    bash: |
      set +e
      python3 .archon/scripts/compliance-gate.py "$ARTIFACTS_DIR"
      code=$?
      if [ $code -eq 0 ]; then echo "PASS"; else echo "FAIL"; fi
      exit 0
    timeout: 60000
    depends_on: [phase-2-fix, phase-2-test-writer]

  - id: phase-2-recovery-diagnose
    command: recovery-diagnose
    depends_on: [phase-2-compliance, read-flag-recovery]
    when: "$phase-2-compliance.output == 'FAIL' && $read-flag-recovery.output == 'true'"
    model: opus
    effort: high
    context: fresh

  - id: phase-2-recovery-fix-prd
    command: recovery-fix-prd
    depends_on: [phase-2-recovery-diagnose]
    when: "$phase-2-compliance.output == 'FAIL' && $read-flag-recovery.output == 'true'"
    model: opus
    effort: high
    context: fresh

  - id: phase-2-recovery-execute
    command: recovery-execute
    depends_on: [phase-2-recovery-fix-prd]
    when: "$phase-2-compliance.output == 'FAIL' && $read-flag-recovery.output == 'true'"
    model: opus
    effort: high
    context: fresh

  - id: phase-2-recovery-regate
    bash: |
      set +e
      python3 .archon/scripts/compliance-gate.py "$ARTIFACTS_DIR"
      code=$?
      if [ $code -eq 0 ]; then echo "PASS"; else echo "FAIL"; fi
      exit 0
    timeout: 60000
    depends_on: [phase-2-recovery-execute]
    when: "$phase-2-compliance.output == 'FAIL' && $read-flag-recovery.output == 'true'"

  - id: phase-2-final-status
    bash: |
      set -euo pipefail
      if [ $phase-2-compliance.output = PASS ]; then
        echo "PASS"
      elif [ $phase-2-recovery-regate.output = PASS ]; then
        echo "PASS"
      else
        echo "FAIL: phase-2 compliance gate failed and recovery did not pass" >&2
        exit 1
      fi
    depends_on: [phase-2-compliance, phase-2-recovery-regate]
    trigger_rule: all_done

  - id: phase-2-checkpoint
    bash: |
      python3 .archon/scripts/full-checkpoint.py "$ARTIFACTS_DIR" $phase-2-baseline.output
    timeout: 300000
    depends_on: [phase-2-final-status]

  # ========= PHASE 3 =========

  - id: phase-2-handoff
    command: phase-handoff
    depends_on: [phase-2-checkpoint]
    model: haiku
    context: fresh

  - id: phase-3-baseline
    bash: |
      git rev-parse HEAD 2>/dev/null || echo "HEAD-fallback-phase3"
    depends_on: [phase-2-handoff]

  - id: phase-3-execute
    command: build-execute-v2
    depends_on: [phase-3-baseline]
    model: sonnet
    context: fresh
    idle_timeout: 900000

  - id: phase-3-review-correctness
    command: build-review-correctness
    depends_on: [phase-3-execute]
    model: sonnet
    context: fresh
    retry:
      max_attempts: 3
      on_error: all

  - id: phase-3-review-failures
    command: build-review-failures
    depends_on: [phase-3-execute]
    model: sonnet
    context: fresh
    retry:
      max_attempts: 3
      on_error: all

  - id: phase-3-review-tests
    command: build-review-tests
    depends_on: [phase-3-execute]
    model: sonnet
    context: fresh
    retry:
      max_attempts: 3
      on_error: all

  - id: phase-3-review-simplify
    command: build-review-simplify
    depends_on: [phase-3-execute]
    model: sonnet
    context: fresh
    retry:
      max_attempts: 3
      on_error: all

  - id: phase-3-lint-autofix
    bash: python3 .archon/scripts/lint-autofix.py "$ARTIFACTS_DIR"
    timeout: 120000
    depends_on: [phase-3-execute]

  - id: phase-3-fix
    command: build-fix-v2
    depends_on: [phase-3-review-correctness, phase-3-review-failures, phase-3-review-tests, phase-3-review-simplify, phase-3-lint-autofix]
    trigger_rule: none_failed_min_one_success
    model: opus
    effort: medium
    context: fresh

  - id: phase-3-test-writer
    command: test-writer
    depends_on: [phase-3-execute]
    model: sonnet
    context: fresh

  - id: phase-3-compliance
    bash: |
      set +e
      python3 .archon/scripts/compliance-gate.py "$ARTIFACTS_DIR"
      code=$?
      if [ $code -eq 0 ]; then echo "PASS"; else echo "FAIL"; fi
      exit 0
    timeout: 60000
    depends_on: [phase-3-fix, phase-3-test-writer]

  - id: phase-3-recovery-diagnose
    command: recovery-diagnose
    depends_on: [phase-3-compliance, read-flag-recovery]
    when: "$phase-3-compliance.output == 'FAIL' && $read-flag-recovery.output == 'true'"
    model: opus
    effort: high
    context: fresh

  - id: phase-3-recovery-fix-prd
    command: recovery-fix-prd
    depends_on: [phase-3-recovery-diagnose]
    when: "$phase-3-compliance.output == 'FAIL' && $read-flag-recovery.output == 'true'"
    model: opus
    effort: high
    context: fresh

  - id: phase-3-recovery-execute
    command: recovery-execute
    depends_on: [phase-3-recovery-fix-prd]
    when: "$phase-3-compliance.output == 'FAIL' && $read-flag-recovery.output == 'true'"
    model: opus
    effort: high
    context: fresh

  - id: phase-3-recovery-regate
    bash: |
      set +e
      python3 .archon/scripts/compliance-gate.py "$ARTIFACTS_DIR"
      code=$?
      if [ $code -eq 0 ]; then echo "PASS"; else echo "FAIL"; fi
      exit 0
    timeout: 60000
    depends_on: [phase-3-recovery-execute]
    when: "$phase-3-compliance.output == 'FAIL' && $read-flag-recovery.output == 'true'"

  - id: phase-3-final-status
    bash: |
      set -euo pipefail
      if [ $phase-3-compliance.output = PASS ]; then
        echo "PASS"
      elif [ $phase-3-recovery-regate.output = PASS ]; then
        echo "PASS"
      else
        echo "FAIL: phase-3 compliance gate failed and recovery did not pass" >&2
        exit 1
      fi
    depends_on: [phase-3-compliance, phase-3-recovery-regate]
    trigger_rule: all_done

  - id: phase-3-checkpoint
    bash: |
      python3 .archon/scripts/full-checkpoint.py "$ARTIFACTS_DIR" $phase-3-baseline.output
    timeout: 300000
    depends_on: [phase-3-final-status]

  # ═══════════════════════════════════════════════════════════════
  # CLAUDE.md PRESENCE AUDIT (M6)
  # ═══════════════════════════════════════════════════════════════

  - id: claude-md-presence-check
    bash: |
      python3 .archon/scripts/claude-md-audit.py "$ARTIFACTS_DIR" $phase-1-baseline.output
    timeout: 60000
    depends_on: [phase-3-checkpoint]

  # ═══════════════════════════════════════════════════════════════
  # CODEBASE CARTOGRAPHER (M7)
  # ═══════════════════════════════════════════════════════════════

  - id: codebase-cartographer
    command: codebase-cartographer
    depends_on: [claude-md-presence-check, read-flag-cartographer]
    when: "$read-flag-cartographer.output == 'true'"
    model: haiku
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # DEPLOY GATE (M8)
  # ═══════════════════════════════════════════════════════════════

  - id: deploy-gate
    bash: |
      set +e
      python3 .archon/scripts/deploy-gate.py "$ARTIFACTS_DIR"
      code=$?
      if [ $code -eq 0 ]; then echo "PASS"; else echo "FAIL"; fi
      exit 0
    timeout: 60000
    depends_on: [claude-md-presence-check]

  # ═══════════════════════════════════════════════════════════════
  # BUILD: REPORT
  # ═══════════════════════════════════════════════════════════════

  - id: build-final-report
    command: build-report
    depends_on: [deploy-gate]
    model: haiku
    context: fresh
    trigger_rule: all_done

  # ═══════════════════════════════════════════════════════════════
  # BUILD: DEPLOY
  # ═══════════════════════════════════════════════════════════════

  - id: build-deploy
    command: build-deploy
    depends_on: [build-final-report]
    when: "$deploy-gate.output == 'PASS'"
    model: sonnet
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PRD ARCHIVE (M10)
  # ═══════════════════════════════════════════════════════════════

  - id: recovery-status-summary
    bash: |
      set -euo pipefail
      if [ $deploy-gate.output != PASS ]; then
        echo "failed"
      elif [ -f "$ARTIFACTS_DIR/triage-report.md" ]; then
        echo "recovered"
      else
        echo "shipped"
      fi
    depends_on: [build-deploy, deploy-gate]
    trigger_rule: all_done

  - id: archive-prd
    bash: |
      python3 .archon/scripts/archive-prd.py \
        "$ARTIFACTS_DIR" \
        "$BASE_BRANCH" \
        $recovery-status-summary.output
    timeout: 60000
    depends_on: [recovery-status-summary]
    when: "$read-flag-archive.output == 'true'"
